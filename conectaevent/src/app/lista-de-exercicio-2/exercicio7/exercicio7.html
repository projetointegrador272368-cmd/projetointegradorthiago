<h2>Exercício 7</h2>

<ul>
  <li
    *ngFor="let disciplina of disciplinas; let i = index; let primeiro = first; let ultimo = last"
    [ngClass]="{
      'primeira': primeiro,
      'ultima': ultimo,
      'par': i % 2 === 0,
      'impar': i % 2 !== 0
    }"
  >
    {{ i + 1 }} - {{ disciplina }}
  </li>
</ul>
