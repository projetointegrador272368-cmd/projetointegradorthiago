<h2>Exercício 8</h2>

<ul>
  <li *ngFor="let produto of produtos; let i = index">
    <strong>{{ i + 1 }} - {{ produto.nome }}</strong>

    <p>ID: {{ produto.id }}</p>
    <p>Preço: {{ produto.preco | currency:'BRL' }}</p>
    <p>Quantidade: {{ produto.quantidade }}</p>
    <p>Valor em estoque: {{ produto.preco * produto.quantidade | currency:'BRL' }}</p>
  </li>
</ul>
